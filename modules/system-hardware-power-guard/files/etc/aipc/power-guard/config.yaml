# DEPRECATED — use /etc/aipc/power-agent/config.yaml
# aipc-power-agent still loads this file if the new path is missing (legacy installs).
# Prefer the nested config under power-agent/; this flat shape maps to backfeed only.

dry_run: true
poll_interval_s: 3
reconnect_observe_period_s: 30
drain_threshold_uw: -1000000
charge_threshold_percent: 85
emergency_freq_factor: 0.45
reconnect_freq_factor: 0.60
recover_freq_factor: 0.80
expand_step: 0.10
epp_emergency: power
epp_normal: default
